<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Superhero Hotel Performance</title></head><body><p id="loading" style="font-family:system-ui;padding:24px">Loading dashboard…</p><script type="module">
try {
  const names = ['part-1.txt','part-2.txt','part-3.txt','part-4.txt','part-5.txt','part-6.txt'];
  const b64 = (await Promise.all(names.map(async n => (await (await fetch('./data/'+n)).text()).trim()))).join('');
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  let html = await new Response(stream).text();
  const theme = `:root{--ink:#f3f5f7;--muted:#9aa4af;--line:#252c34;--accent:#8fb8d8;--bar:#6f9fc4;--barsoft:#223342;--bg:#0b0f14;--panel:#11171d;--accent2:#d9a66a;--bar2:#d59a58;--soft:#171f27;--shadow:0 14px 38px rgba(0,0,0,.22)}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0!important;padding:40px 34px 54px!important;color:var(--ink)!important;background:var(--bg)!important;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif!important;-webkit-font-smoothing:antialiased}body>*{max-width:1480px!important;margin-left:auto!important;margin-right:auto!important}body>div:first-child{margin-bottom:22px!important}body>div:first-child>div:first-child{font-size:11px!important;color:var(--accent)!important;letter-spacing:.14em!important;text-transform:uppercase!important;font-weight:760!important}body>div:first-child>div:nth-child(2){font-size:13px!important;line-height:1.6!important;color:var(--muted)!important;margin-top:7px!important;max-width:840px!important}header{display:flex!important;align-items:center!important;justify-content:space-between!important;gap:16px!important;flex-wrap:wrap!important;margin-bottom:24px!important;padding:11px!important;background:var(--panel)!important;border:1px solid var(--line)!important;border-radius:14px!important;box-shadow:var(--shadow)!important}.modes{display:inline-flex!important;gap:3px!important;padding:3px!important;background:var(--soft)!important;border:1px solid #202832!important;border-radius:10px!important}.modes button{border:0!important;border-radius:7px!important;background:transparent!important;color:var(--muted)!important;padding:8px 13px!important;font:620 13px/1.1 inherit!important}.modes button:hover{color:var(--ink)!important;background:#1b242d!important}.modes button.active{color:var(--ink)!important;background:#222c36!important;box-shadow:inset 0 0 0 1px #313c47!important}.toggle{color:var(--muted)!important;font-size:13px!important}.toggle input{accent-color:var(--accent2)!important}.toggle.on{color:#e5bb8a!important;background:#241c14!important}.nav{font-size:14px!important}.nav button{width:34px!important;height:34px!important;border:1px solid #2b3540!important;border-radius:8px!important;background:#151c23!important;color:var(--ink)!important}.nav .label{font-weight:650!important}.nav input[type=date]{border:1px solid #2b3540!important;border-radius:7px!important;background:#151c23!important;color:var(--ink)!important;color-scheme:dark}.grid{display:grid!important;grid-template-columns:1fr 1fr!important;gap:22px!important}.panel{min-width:0!important;background:var(--panel)!important;border:1px solid var(--line)!important;border-radius:14px!important;padding:19px!important;box-shadow:var(--shadow)!important}.panel h2{font-size:16px!important;font-weight:670!important;color:#f6f7f8!important}.chartwrap{background:transparent!important;border:0!important}.chartwrap svg line{stroke:#27303a!important}.chartwrap svg text{fill:#8f9aa5!important}.stat h3{color:#7f8a95!important}.stat .sgrid{border-top:1px solid #28313a!important;border-bottom:0!important}.stat .k{color:#8f9aa5!important;border-color:#242c34!important}.stat .v{color:#f1f3f5!important;border-color:#242c34!important}.stat .v.alt,.stat .shead.alt{color:#e0b37f!important}.cutoff{background:var(--panel)!important;border:1px solid var(--line)!important;border-radius:14px!important;box-shadow:var(--shadow)!important}.cutoff .lbl,.foot{color:var(--muted)!important}.cutoff .lbl b{color:#f4f6f8!important}a{color:#9bc2e0!important}@media(max-width:1100px){.grid{grid-template-columns:1fr!important}}@media(max-width:720px){body{padding:24px 15px 38px!important}.panelbody{display:block!important}}`;
  html = html.replace('</head>', '<style>'+theme+'</style></head>');
  document.open(); document.write(html); document.close();
} catch (e) {
  document.getElementById('loading').textContent = 'Could not load dashboard: ' + e.message;
}
</script></body></html>
