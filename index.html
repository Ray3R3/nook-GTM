<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Superhero Hotel Performance</title></head><body><p id="loading" style="font-family:system-ui;padding:24px">Loading dashboard…</p><script type="module">
try {
  const names = ['part-1.txt','part-2.txt','part-3.txt','part-4.txt','part-5.txt','part-6.txt'];
  const b64 = (await Promise.all(names.map(async n => (await (await fetch('./data/'+n)).text()).trim()))).join('');
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  let html = await new Response(stream).text();
  html = html.replace('</head>', '<link rel="stylesheet" href="./theme.css"></head>');
  document.open(); document.write(html); document.close();
} catch (e) {
  document.getElementById('loading').textContent = 'Could not load dashboard: ' + e.message;
}
</script></body></html>
