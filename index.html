<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOOK BENCHMARK - HYPNOS</title></head><body><p id="loading" style="font-family:system-ui;padding:24px">Loading dashboard…</p><script type="module">
try {
  const names = ['corrected-01.txt','corrected-02.txt','corrected-03.txt','corrected-04.txt','corrected-05a.txt','corrected-05b.txt','corrected-05c.txt','corrected-05d.txt'];
  const b64 = (await Promise.all(names.map(async n => {
    const r = await fetch('./data/' + n + '?v=realised-20260811');
    if (!r.ok) throw new Error(`${n} ${r.status}`);
    return (await r.text()).trim();
  }))).join('');
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  let html = await new Response(stream).text();
  const legendFix = `<script>(function(){
    function tidy(){
      document.querySelectorAll('svg text').forEach(function(t){
        var s=(t.textContent||'').trim();
        if(s==='■ SHH') { t.setAttribute('x','138'); t.setAttribute('y','14'); t.setAttribute('font-size','10'); }
        if(s==='● Nook' || s==='■ Nook') { t.setAttribute('x','205'); t.setAttribute('y','14'); t.setAttribute('font-size','10'); }
      });
    }
    var obs=new MutationObserver(tidy);
    obs.observe(document.body,{childList:true,subtree:true});
    tidy();
  })();<\/script>`;
  html = html.replace('</body>', legendFix + '</body>');
  document.open(); document.write(html); document.close();
} catch (e) {
  document.getElementById('loading').textContent = 'Could not load dashboard: ' + e.message;
}
</script></body></html>
