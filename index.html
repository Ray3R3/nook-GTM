<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOOK BENCHMARK - HYPNOS</title></head><body><p id="loading" style="font-family:system-ui;padding:24px">Loading dashboard…</p><script type="module">
try {
  const names = ['corrected-01-a.txt', 'corrected-01-b.txt', 'corrected-01-c.txt', 'corrected-02.txt', 'corrected-03.txt', 'corrected-04.txt', 'corrected-05a-a.txt', 'corrected-05a-b.txt', 'corrected-05a-c.txt', 'corrected-05b-a.txt', 'corrected-05b-b.txt', 'corrected-05b-c.txt', 'corrected-05c.txt', 'corrected-05d.txt'];
  const b64 = (await Promise.all(names.map(async n => {
    const r = await fetch('./data/' + n + '?v=ux-20260812c');
    if (!r.ok) throw new Error(`${n} ${r.status}`);
    return (await r.text()).trim();
  }))).join('');
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const html = await new Response(stream).text();
  document.open(); document.write(html); document.close();
} catch (e) {
  document.getElementById('loading').textContent = 'Could not load dashboard: ' + e.message;
}
</script></body></html>
