<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOOK BENCHMARK - HYPNOS</title></head><body><p id="loading" style="font-family:system-ui;padding:24px">Loading dashboard…</p><script type="module">
try {
  const response = await fetch('./data/dashboard.gz?v=nook-compare-1');
  if (!response.ok) throw new Error(`dashboard payload ${response.status}`);
  const stream = response.body.pipeThrough(new DecompressionStream('gzip'));
  const html = await new Response(stream).text();
  document.open(); document.write(html); document.close();
} catch (e) {
  document.getElementById('loading').textContent = 'Could not load dashboard: ' + e.message;
}
</script></body></html>
